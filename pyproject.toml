[project]
name = "mbpe"
version = "0.1.0"
requires-python = "~=3.12.0"
dependencies = [
    "catboost>=1.2.10",
    "google-cloud-bigquery>=3.46.2",
    "lightgbm>=4.7.0",
    "mlflow>=3",
    "numpy>=2.5.4",
    "optuna>=5.0.0",
    "pandera[polars]>=0.35.0",
    "polars>=2.1.0",
    "praw>=8.0.3",
    "pyarrow>=25,<26",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
    "transformers>=5.21.0",
    "websocket-client>=1.9.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 110
extend-exclude = ["reference", "feasibility.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
