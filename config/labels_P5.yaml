# Phase 5 labels (SCOPE.md, "Phase 5 pre-registration"): 4-hourly decisions, 24 h horizon, daily-ATR barriers.
tp_atr: 2.0            # take-profit distance, in ATRs
sl_atr: 1.0            # stop distance, in ATRs (also the R unit)
horizon_minutes: 1440  # 24 h barrier window from the entry minute
atr_period: 14         # Wilder ATR(14) on UTC daily bars closed at or before t
atr_timeframe: 1d
decision_every_hours: 4  # 00, 04, 08, 12, 16, 20 UTC
taker_fee: 0.0005      # fraction of notional, per side
slippage_bps: 2.0      # per side
latency_minutes: 1     # entry at the open of the 1m candle starting at t + latency
funding_interval_hours: 8  # labels fail if a funding time inside a trade window has no data
maker_fee: 0.0002      # "maker_entry_tp" cost scenario only
output: data/labels/triple_barrier_P5.parquet
