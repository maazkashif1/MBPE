# Label set B: identical to set A (labels.yaml) except the ATR timeframe. Loaded by mbpe.labels.triple_barrier.load_config.
tp_atr: 2.0            # take-profit distance, in ATRs
sl_atr: 1.0            # stop distance, in ATRs (also the R unit)
horizon_minutes: 240   # barrier window from the entry minute
atr_period: 14         # Wilder ATR on 1h bars
taker_fee: 0.0005      # fraction of notional, per side
slippage_bps: 2.0      # per side
latency_minutes: 1     # entry at the open of the 1m candle starting at t + latency
atr_timeframe: 4h      # label set B: Wilder ATR(14) on 4h bars
maker_fee: 0.0002      # "maker_entry_tp" cost scenario only
output: data/labels/triple_barrier_B.parquet
